name: Run Analysis Cycle (Mac Mini)

on:
  # 매일 오전 10시(Asia/Seoul) = 01:00 UTC
  schedule:
    - cron: "0 1 * * *"

  # .deploy-trigger 파일 push → Claude Code 등 외부에서 원격 트리거
  push:
    branches: [main]
    paths:
      - ".deploy-trigger"

  # 대시보드 API 또는 GitHub API 에서 repository_dispatch 로 트리거
  repository_dispatch:
    types: [run-cycle]

  # GitHub Actions UI 에서 수동 실행
  workflow_dispatch:
    inputs:
      date:
        description: "분석 날짜 (YYYY-MM-DD, 비워두면 오늘)"
        required: false
        default: ""

jobs:
  run-cycle:
    name: Run Analysis & Push Data
    runs-on: self-hosted   # Mac Mini self-hosted runner

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0          # push-to-github.sh 에서 data 브랜치 전환 필요

      - name: Resolve date
        id: date
        run: |
          # workflow_dispatch 입력값 → repository_dispatch payload → .deploy-trigger 파일 → 오늘 날짜 순으로 fallback
          REQUESTED_DATE="${{ github.event.inputs.date }}"
          if [ -z "$REQUESTED_DATE" ]; then
            REQUESTED_DATE="${{ github.event.client_payload.date }}"
          fi
          if [ -z "$REQUESTED_DATE" ] && [ -f ".deploy-trigger" ]; then
            TRIGGER_CONTENT="$(cat .deploy-trigger | tr -d '[:space:]')"
            if echo "$TRIGGER_CONTENT" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              REQUESTED_DATE="$TRIGGER_CONTENT"
            fi
          fi

          if [ -n "$REQUESTED_DATE" ]; then
            DATE="$(node scripts/resolve-cycle-date.js --date "$REQUESTED_DATE")"
            REASON="$(node scripts/resolve-cycle-date.js --date "$REQUESTED_DATE" --field reason)"
          else
            DATE="$(node scripts/resolve-cycle-date.js)"
            REASON="$(node scripts/resolve-cycle-date.js --field reason)"
          fi

          echo "value=$DATE" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "resolved cycle date: $DATE ($REASON)"

      - name: Run analysis cycle (Step 1–6)
        # run-daily-system.sh: 최신 단일 진입점. --skip-push 로 push는 다음 step에서 분리
        run: bash scripts/run-daily-system.sh --date "${{ steps.date.outputs.value }}" --skip-push
        env:
          # API 키는 GitHub Repository Secrets 에 등록
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY:      ${{ secrets.FRED_API_KEY }}
          BOK_API_KEY:       ${{ secrets.BOK_API_KEY }}

      - name: Push results to data branch
        run: bash scripts/push-to-github.sh "${{ steps.date.outputs.value }}"
        env:
          # self-hosted runner 는 기본적으로 GITHUB_TOKEN 으로 push 가능
          GIT_AUTHOR_NAME:  "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME:  "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "github-actions[bot]@users.noreply.github.com"
