name: Run Analysis Cycle (Mac Mini)

on:
  # 매일 오전 10시(Asia/Seoul) = 01:00 UTC
  schedule:
    - cron: "0 1 * * *"

  # .deploy-trigger 파일 push → Claude Code 등 외부에서 원격 트리거
  # - 'YYYY-MM-DD'         → 해당 날짜로 전체 분석 사이클 실행
  # - 'push-only:YYYY-MM-DD' → 분석 없이 로컬 데이터만 data 브랜치에 push
  push:
    branches: [main]
    paths:
      - ".deploy-trigger"

  # 대시보드 API 또는 GitHub API 에서 repository_dispatch 로 트리거
  repository_dispatch:
    types: [run-cycle]

  # GitHub Actions UI 에서 수동 실행
  workflow_dispatch:
    inputs:
      date:
        description: "분석 날짜 (YYYY-MM-DD, 비워두면 오늘)"
        required: false
        default: ""
      push_only:
        description: "분석 없이 데이터 push만 (true/false)"
        required: false
        default: "false"

jobs:
  run-cycle:
    name: Run Analysis & Push Complete Data
    runs-on: self-hosted   # Mac Mini self-hosted runner

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve date and mode
        id: opts
        run: |
          PUSH_ONLY="false"
          REQUESTED_DATE="${{ github.event.inputs.date }}"

          # workflow_dispatch push_only 플래그
          if [ "${{ github.event.inputs.push_only }}" = "true" ]; then
            PUSH_ONLY="true"
          fi

          # repository_dispatch
          if [ -z "$REQUESTED_DATE" ]; then
            REQUESTED_DATE="${{ github.event.client_payload.date }}"
          fi

          # .deploy-trigger 파일 파싱
          if [ -z "$REQUESTED_DATE" ] && [ -f ".deploy-trigger" ]; then
            TRIGGER_CONTENT="$(cat .deploy-trigger | tr -d '[:space:]')"
            if echo "$TRIGGER_CONTENT" | grep -Eq '^push-only:[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              PUSH_ONLY="true"
              REQUESTED_DATE="${TRIGGER_CONTENT#push-only:}"
            elif echo "$TRIGGER_CONTENT" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              REQUESTED_DATE="$TRIGGER_CONTENT"
            fi
          fi

          if [ -n "$REQUESTED_DATE" ]; then
            DATE="$(node scripts/resolve-cycle-date.js --date "$REQUESTED_DATE")"
            REASON="$(node scripts/resolve-cycle-date.js --date "$REQUESTED_DATE" --field reason)"
          else
            DATE="$(node scripts/resolve-cycle-date.js)"
            REASON="$(node scripts/resolve-cycle-date.js --field reason)"
          fi

          echo "value=$DATE" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "push_only=$PUSH_ONLY" >> "$GITHUB_OUTPUT"
          echo "resolved: $DATE ($REASON) / push_only=$PUSH_ONLY"

      - name: Run analysis cycle (Step 1–6)
        if: steps.opts.outputs.push_only != 'true'
        run: bash scripts/run-daily-system.sh --date "${{ steps.opts.outputs.value }}" --skip-push
        env:
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY:      ${{ secrets.FRED_API_KEY }}
          BOK_API_KEY:       ${{ secrets.BOK_API_KEY }}

      - name: Push results to data branch
        run: bash scripts/push-to-github.sh "${{ steps.opts.outputs.value }}"
        env:
          GIT_AUTHOR_NAME:  "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME:  "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "github-actions[bot]@users.noreply.github.com"
