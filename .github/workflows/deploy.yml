name: Deploy Dashboard to Vercel

on:
  # data 브랜치에 push 될 때마다 재배포
  push:
    branches:
      - data
  # 또는 분석 사이클 완료 후 자동 배포
  workflow_run:
    workflows: ["Run Analysis Cycle (Mac Mini)"]
    types:
      - completed

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          fetch-depth: 0

      - name: Merge main branch (dashboard code)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          # main 의 dashboard/ 코드를 data 위에 병합 (충돌 시 main 우선)
          git merge origin/main --allow-unrelated-histories \
            --strategy-option=theirs \
            -m "chore: merge main for deploy" || true

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel
        working-directory: ./dashboard
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
