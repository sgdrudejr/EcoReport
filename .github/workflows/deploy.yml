name: Deploy Dashboard to Vercel

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "배포 사유 (선택)"
        required: false
        default: ""
  repository_dispatch:
    types:
      - deploy-vercel
  push:
    branches:
      - main
    paths:
      - ".vercel-deploy-trigger"

# 동시에 여러 배포가 쌓이지 않도록: 새 배포 시작 시 대기 중인 이전 배포 취소
concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout trigger ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve deploy request
        id: request
        shell: bash
        run: |
          REASON=""
          REQUESTED_AT=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REASON="${{ github.event.inputs.reason }}"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            REASON="${{ github.event.client_payload.reason }}"
            REQUESTED_AT="${{ github.event.client_payload.requested_at }}"
          fi

          if [ -z "$REASON" ] && [ -f ".vercel-deploy-trigger" ]; then
            REASON="$(sed -n 's/^reason=//p' .vercel-deploy-trigger | head -n 1)"
          fi

          if [ -z "$REQUESTED_AT" ] && [ -f ".vercel-deploy-trigger" ]; then
            REQUESTED_AT="$(sed -n 's/^requested_at=//p' .vercel-deploy-trigger | head -n 1)"
          fi

          if [ -z "$REASON" ]; then
            REASON="manual request"
          fi

          if [ -z "$REQUESTED_AT" ]; then
            REQUESTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi

          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "requested_at=$REQUESTED_AT" >> "$GITHUB_OUTPUT"
          echo "reason: $REASON"
          echo "requested_at: $REQUESTED_AT"

      - name: Prepare data + main deploy workspace
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data
            git checkout -B vercel-deploy origin/data
            git merge origin/main --allow-unrelated-histories \
              --strategy-option=theirs \
              -m "chore: merge main for vercel deploy"
          else
            git checkout -B vercel-deploy origin/main
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "Deploy reason: ${{ steps.request.outputs.reason }}"
          echo "Requested at: ${{ steps.request.outputs.requested_at }}"
          vercel --prod --token "$VERCEL_TOKEN" --yes
